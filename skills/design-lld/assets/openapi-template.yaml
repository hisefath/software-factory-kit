# guide: design-lld contract template -> docs/architecture/contracts/openapi.yaml (OpenAPI 3.1).
# guide: Replace every {{placeholder}} and delete every "# guide:" line when filling.
# guide: One operation per EP row in lld.md section 4, each carrying `x-lld-id: EP-n` (the Done-when check joins on it).
# guide: Every 4xx/5xx response returns application/problem+json (RFC 9457) via components/responses.
# guide: 422 always uses UnprocessableProblem (validation with errors[], or a business-rule / idempotency-mismatch
# guide: problem without it). Problem `type` values are the full registry path /problems/<slug> from lld.md section 4.
# guide: OpenAPI 3.1 uses JSON Schema 2020-12: nullable is `type: [string, "null"]`, never `nullable: true`.
# guide: HTML pages and form posts are operations too: `text/html` 200, or 303 with a Location header.
# guide: Example values are obviously fake. No secrets, tokens or real patient data.
openapi: 3.1.0
info:
  title: "{{Product name}} API"
  version: "{{0.1.0}}"
  description: "Contract for {{M<N>-slug}}. Shapes are designed in docs/architecture/lld.md section 4."
servers:
  - url: "{{http://localhost:8000}}"
    description: local
security:
  - "{{sessionCookie}}": []
tags:
  - name: "{{orders}}"
paths:
  "{{/orders}}":
    post:
      x-lld-id: "{{EP-1}}"
      operationId: "{{placeOrder}}"
      summary: "{{Place an order}}"
      tags: ["{{orders}}"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/{{PlaceOrderRequest}}"
      responses:
        "201":
          description: "{{Order placed}}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/{{Order}}"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableProblem"
    get:
      x-lld-id: "{{EP-2}}"
      operationId: "{{listOrders}}"
      summary: "{{List orders, newest first}}"
      tags: ["{{orders}}"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: "{{One page of orders}}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/{{OrderPage}}"
        "401":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    "{{sessionCookie}}":
      type: apiKey
      in: cookie
      name: "{{session cookie name}}"
  parameters:
    # guide: JSON clients send the key as this header. HTML form posts cannot set headers: drop this parameter
    # guide: from the operation and declare a required `idempotency_key` string property in its requestBody
    # guide: (application/x-www-form-urlencoded) instead; replay, mismatch and in-flight rules stay the same.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Client-generated unique key (e.g. a UUID). Same key + same body replays the stored response."
      schema:
        type: string
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      required: false
      description: "Opaque cursor from the previous page's next_cursor."
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: {{100}}
        default: {{25}}
  responses:
    Problem:
      description: "Error as RFC 9457 problem details."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableProblem:
      description: "422: validation failed (errors[] lists each invalid field) or a business rule rejected a
        well-formed request (no errors[])."
      content:
        application/problem+json:
          schema:
            # anyOf, not oneOf: a ValidationProblem is also a valid Problem, so oneOf would reject it.
            anyOf:
              - $ref: "#/components/schemas/ValidationProblem"
              - $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: "RFC 9457 problem details. `type` identifies the problem; see lld.md section 4 Problem types."
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          examples: ["{{/problems/out-of-stock}}"]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
      required: [type, title, status]
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                properties:
                  pointer:
                    type: string
                    description: "JSON Pointer to the invalid field, e.g. #/quantity"
                  detail:
                    type: string
                required: [pointer, detail]
          required: [errors]
    "{{PlaceOrderRequest}}":
      type: object
      additionalProperties: false
      properties:
        "{{patient_id}}":
          type: string
        "{{lines}}":
          type: array
          minItems: 1
          items:
            type: object
            properties:
              "{{product_id}}":
                type: string
              "{{quantity}}":
                type: integer
                minimum: 1
            required: ["{{product_id}}", "{{quantity}}"]
      required: ["{{patient_id}}", "{{lines}}"]
    "{{Order}}":
      type: object
      properties:
        id:
          type: string
        "{{status}}":
          type: string
          enum: ["{{draft}}", "{{placed}}", "{{paid}}", "{{cancelled}}"]
        "{{total_amount}}":
          type: integer
          description: "Minor units (e.g. cents)."
        # guide: omit currency when the PRD fixes a single currency (lld.md section 1 says so).
        "{{currency}}":
          type: string
          pattern: "^[A-Z]{3}$"
        created_at:
          type: string
          format: date-time
      required: [id, "{{status}}", "{{total_amount}}", "{{currency}}", created_at]
    "{{OrderPage}}":
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/{{Order}}"
        next_cursor:
          type: ["string", "null"]
      required: [data, next_cursor]
